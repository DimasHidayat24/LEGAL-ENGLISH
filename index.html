<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lexa — Legal English for Indonesian law students</title>
    <script>
      // Apply the saved theme before first paint (light is the default).
      (function () {
        try {
          var t = localStorage.getItem('lexa_theme_mode') === 'dark' ? 'dark' : 'light';
          var r = document.documentElement;
          r.classList.add(t);
          r.setAttribute('data-theme', t);
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Legal English explained through Indonesian law — contracts, doctrine, and drafting, side by side." />
    <meta property="og:title" content="Lexa — Legal English for Indonesian law students" />
    <meta property="og:description" content="Legal English explained through Indonesian law — contracts, doctrine, and drafting, side by side." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Geist (UI) + Source Serif 4 (legal text) are self-hosted via @fontsource-variable in src/index.css -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
